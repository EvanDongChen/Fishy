<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fishy Pet</title>
    <link rel="stylesheet" href="pet.css" />
  </head>
  <body>
    <div class="stage" id="stage">
      <div class="pet" id="pet" aria-label="Desktop pet">
        <div class="fish-layered" role="img" aria-label="Orange fish">
          <img class="part tail" src="assets/fish/backfin.png" alt="" />
          <img class="part body" src="assets/fish/body.png" alt="" />
          <img class="part fin-top" src="assets/fish/topfin.png" alt="" />
          <img class="part fin-bottom" src="assets/fish/bottomfin.png" alt="" />
          <div class="part eye-group" aria-hidden="true">
            <img class="eye-base" src="assets/fish/emptyeye.png" alt="" />
            <div class="pupil" id="pupil"></div>
          </div>
        </div>
        <div class="effects hearts" id="hearts" aria-hidden="true"></div>
        <div class="effects bubbles" id="bubbles" aria-hidden="true"></div>
        <div class="effects typing" id="typing" aria-hidden="true"></div>
        <div class="emote" id="emote" aria-hidden="true"></div>
        <div class="mode-menu" id="mode-menu" aria-hidden="true">
          <button type="button" data-mode="roam">Roam</button>
          <button type="button" data-mode="idle">Idle</button>
          <button type="button" data-action="settings">Settings</button>
        </div>
      </div>
      <div class="settings-panel" id="settings-panel" aria-hidden="true">
        <h3>Fish Settings</h3>
        <label>Speed
          <input id="setting-speed" type="range" min="0.5" max="2" step="0.05" />
        </label>
        <label>Pet Sensitivity
          <input id="setting-pet-sensitivity" type="range" min="0.5" max="2" step="0.05" />
        </label>
        <label>Heart Amount
          <input id="setting-heart-amount" type="range" min="0" max="3" step="0.1" />
        </label>
        <label>Bubble Amount
          <input id="setting-bubble-amount" type="range" min="0" max="3" step="0.1" />
        </label>
        <label>Pupil Size
          <input id="setting-pupil-size" type="range" min="0.6" max="1.8" step="0.05" />
        </label>
        <label>Monitor
          <select id="setting-monitor"></select>
        </label>
        <button type="button" id="settings-close">Close</button>
      </div>
    </div>
    <script src="pet.js"></script>
  </body>
</html>
