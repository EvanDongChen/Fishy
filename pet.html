<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fishy Pet</title>
    <link rel="stylesheet" href="pet.css" />
  </head>
  <body>
    <div class="stage" id="stage">
      <div class="pet" id="pet" aria-label="Desktop pet">
        <div class="fish-layered" role="img" aria-label="Orange fish">
          <img class="part tail" src="assets/fish/tail.svg" alt="" />
          <img class="part body" src="assets/fish/body.svg" alt="" />
          <img class="part fin-top" src="assets/fish/fin-top.svg" alt="" />
          <img class="part fin-bottom" src="assets/fish/fin-bottom.svg" alt="" />
          <img class="part eye" src="assets/fish/eye.svg" alt="" />
        </div>
      </div>
    </div>
    <script src="pet.js"></script>
  </body>
</html>
